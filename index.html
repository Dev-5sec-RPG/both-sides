<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Both Sides</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Text:wght@600;800&family=BIZ+UDPGothic:wght@400;700&family=IBM+Plex+Mono:wght@500;600&family=Shippori+Mincho+B1:wght@500;700;800&display=swap">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="desk.css">
</head>
<body>
<div id="stage" class="full">
  <canvas id="fx" aria-hidden="true"></canvas>
  <div class="topbar">
    <div class="brand"><img src="img/logo.png" alt="BOTH SIDES"></div>
    <div class="clock">
      <div class="ct"><span data-t="cal"></span><b id="hDate"></b></div>
      <div class="track"><i id="hTrack" style="width:0"></i></div>
      <div class="step" id="hStep"></div>
    </div>
    <div class="sp"></div>
    <div class="hv"><small data-t="money"></small><b id="hMoney" data-full=""></b></div>
    <div class="hv"><small data-t="profit"></small><b id="hProfit" data-full=""></b></div>
    <button class="ibtn" id="bPause"></button>
    <button class="ibtn" id="bFull" hidden><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"></path></svg></button>
    <span class="hsep" aria-hidden="true"></span>
    <button class="ibtn" id="bRetreat" data-t="retreat"></button>
    <button class="ibtn" id="bHome" data-t="home"></button>
  </div>

  <div class="map" id="map">
    <svg class="terrain" viewBox="0 0 1000 500" preserveAspectRatio="none" aria-hidden="true">
      <defs>
        <linearGradient id="gA" x1="0" x2="1" y1="0" y2="0"><stop offset="0" stop-color="#5f93c9" stop-opacity=".10"></stop><stop offset="1" stop-color="#5f93c9" stop-opacity=".30"></stop></linearGradient>
        <linearGradient id="gB" x1="1" x2="0" y1="0" y2="0"><stop offset="0" stop-color="#c7664f" stop-opacity=".10"></stop><stop offset="1" stop-color="#c7664f" stop-opacity=".30"></stop></linearGradient>
        <filter id="glow" x="-50%" y="-5%" width="200%" height="110%"><feGaussianBlur stdDeviation="4"></feGaussianBlur></filter>
      </defs>
      <rect x="0" y="0" width="1000" height="500" fill="var(--terrain)"></rect>
      <g class="grid">
        <line x1="125" y1="0" x2="125" y2="500"></line><line x1="250" y1="0" x2="250" y2="500"></line><line x1="375" y1="0" x2="375" y2="500"></line><line x1="500" y1="0" x2="500" y2="500"></line><line x1="625" y1="0" x2="625" y2="500"></line><line x1="750" y1="0" x2="750" y2="500"></line><line x1="875" y1="0" x2="875" y2="500"></line>
        <line x1="0" y1="100" x2="1000" y2="100"></line><line x1="0" y1="200" x2="1000" y2="200"></line><line x1="0" y1="300" x2="1000" y2="300"></line><line x1="0" y1="400" x2="1000" y2="400"></line>
      </g>
      <g fill="none" stroke="var(--contour)" stroke-width="1.2" vector-effect="non-scaling-stroke">
        <path d="M-20 80 C 160 40, 300 140, 480 90 S 780 50, 1020 110"></path>
        <path d="M-20 150 C 170 110, 320 210, 500 160 S 800 120, 1020 180"></path>
        <path d="M-20 340 C 140 300, 330 400, 520 350 S 770 310, 1020 380"></path>
        <path d="M-20 420 C 190 380, 340 480, 510 430 S 820 390, 1020 450"></path>
        <path d="M90 230 C 130 210, 180 220, 195 250 S 160 300, 115 280 S 65 250, 90 230 Z"></path>
        <path d="M780 210 C 820 185, 875 200, 885 235 S 845 280, 805 270 S 755 240, 780 210 Z"></path>
      </g>
      <path d="M -10 280 C 160 262, 330 308, 500 290 S 790 262, 1010 282" fill="none" stroke="#3d5a6e" stroke-width="5" opacity=".55" vector-effect="non-scaling-stroke"></path>
      <polygon id="polyA" points="" fill="url(#gA)"></polygon>
      <polygon id="polyB" points="" fill="url(#gB)"></polygon>
      <polyline id="frontGlow" points="" fill="none" stroke="var(--brass2)" stroke-width="16" opacity=".16" filter="url(#glow)" stroke-linejoin="round"></polyline>
      <polyline id="front1" points="" fill="none" stroke="var(--bg)" stroke-width="9" stroke-linejoin="round" vector-effect="non-scaling-stroke"></polyline>
      <polyline id="front2" points="" fill="none" stroke="var(--brass2)" stroke-width="3" stroke-dasharray="10 6" stroke-linejoin="round" vector-effect="non-scaling-stroke"></polyline>
    </svg>
    <div id="paper" aria-hidden="true"></div>
    <div class="cap" id="capA" style="color:var(--a)"><div class="dot"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2l3 7 7 .6-5.3 4.6 1.6 7.3L12 17.8 5.7 21.5l1.6-7.3L2 9.6 9 9z"></path></svg></div><span data-t="capA"></span></div>
    <div class="cap" id="capB" style="color:var(--b)"><div class="dot"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2l3 7 7 .6-5.3 4.6 1.6 7.3L12 17.8 5.7 21.5l1.6-7.3L2 9.6 9 9z"></path></svg></div><span data-t="capB"></span></div>
    <div class="pill" id="pill"><span class="pa" id="pA"></span><span class="pm" data-t="frontline"></span><span class="pb" id="pB"></span></div>
    <div class="effs" id="effs"></div>
    <div class="ship" id="shipA" style="left:20%"></div>
    <div class="ship" id="shipB" style="right:20%;justify-content:flex-end"></div>
    <section class="card A" id="cA"></section>
    <section class="card B" id="cB"></section>
  </div>

  <div class="tray">
    <div id="stockBox"><div class="tl" data-t="stockTitle"></div><div class="stock" id="stock"></div></div>
    <div class="wire" id="wireBox"><div class="tl" data-t="newsTitle"></div><ul id="wire"></ul></div>
  </div>

  <div id="vig"></div>
  <div id="tip" hidden></div>
  <div class="modal" id="modal" hidden><div class="mc" id="mc" role="dialog" aria-modal="true"></div></div>
  <div id="fade"><div class="ft"><b id="fadeT"></b><span id="fadeS"></span><p id="fadeX"></p></div></div>
  <div id="movie" hidden>
    <div class="mv-stage" id="mvStage">
      <video id="mvA0" muted playsinline preload="auto" src="media/left_intro.mp4"></video>
      <video id="mvA1" muted playsinline preload="auto" loop src="media/left_loop.mp4"></video>
      <video id="mvB0" muted playsinline preload="auto" src="media/right_intro.mp4"></video>
      <video id="mvB1" muted playsinline preload="auto" loop src="media/right_loop.mp4"></video>
    </div>
    <div class="mv-talk" id="mvTalk" hidden><div class="mv-who" id="mvWho"></div><p id="mvText"></p><div class="mv-foot"><span class="mv-hint" id="mvHint"></span><span class="mv-pg" id="mvPg"></span></div></div>
    <button class="mv-skip" id="mvSkip" type="button"></button>
    <div class="mv-black" id="mvBlack"></div>
  </div>

  <div id="home">
    <div class="hmenu">
      <button class="hbtn primary" id="hNew" data-t="hNew"></button>
      <button class="hbtn" id="hTut" data-t="hTut"></button>
      <button class="hbtn" id="hRec" data-t="hRec"></button>
      <button class="hbtn" id="hSet" data-t="hSet"></button>
      <button class="hbtn" id="hLang">Language</button>
    </div>
    <div class="hver">WEB TRIAL</div>
    <div class="hpop" id="hpop" hidden></div>
  </div>

  <div id="tut" hidden></div>
</div>

<div id="rotate" hidden>
  <div class="in">
    <svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="var(--brass)" stroke-width="1.6" aria-hidden="true"><rect x="7" y="2" width="10" height="20" rx="2"></rect><path d="M20 9a8 8 0 0 1 0 6M22 7a11 11 0 0 1 0 10"></path></svg>
    <p style="margin:0;line-height:1.7" data-t="rotate"></p>
    <button class="btn" id="bRotOk" data-t="rotateOk"></button>
  </div>
</div>

<script src="engine.js"></script>
<script src="maps.js"></script>
<script src="se.js"></script>
<script src="bgm.js"></script>
<script src="ui.js"></script>
<script src="tutorial.js"></script>
<script src="pad.js"></script>
</body>
</html>
