<title>Both Sides</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Text:wght@600;800&family=BIZ+UDPGothic:wght@400;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: god's-eye war table. The map is the screen; state cards float on each territory; the stockroom and wire run along the bottom. One fixed stage scaled to the viewport. */
:root {
  --bg: #14171a; --ink: #101315; --panel: #1c2024; --panel2: #23282d; --line: #323940;
  --fg: #ddd8cb; --muted: #9a9e98; --brass: #c8a14c; --brass2: #e2c07d;
  --a: #5f93c9; --a2: #8fb6de; --a3: #3b6a99; --b: #c7664f; --b2: #e09a88; --b3: #8e3f2f;
  --good: #74ad7c; --bad: #d4574b; --bad2: #e58a7f; --warn: #d98a3e;
  --terrain: #2a2f26; --contour: #3a4134;
  --f-disp: "Big Shoulders Text", "Arial Narrow", sans-serif;
  --f-body: "BIZ UDPGothic", "Hiragino Sans", "Yu Gothic", sans-serif;
  --f-num: "IBM Plex Mono", ui-monospace, "SFMono-Regular", monospace;
  color-scheme: dark;
}
html, body { height: 100%; margin: 0; overflow: hidden; background: var(--bg); color: var(--fg); }
body { font-family: var(--f-body); font-size: 13px; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; }
.num { font-family: var(--f-num); font-variant-numeric: tabular-nums; }

#stage { position: absolute; left: 0; top: 0; transform-origin: 0 0; overflow: hidden; background: var(--bg); }
#stage.full { width: 1280px; height: 720px; --top: 56px; --tray: 168px; }
#stage.compact { width: 900px; height: 420px; --top: 40px; --tray: 72px; font-size: 12px; }

/* top bar */
.topbar { position: absolute; left: 0; top: 0; right: 0; height: var(--top); padding: 0 16px; display: flex; align-items: center; gap: 22px; background: var(--ink); border-bottom: 1px solid var(--line); }
.compact .topbar { gap: 12px; padding: 0 10px; }
.brand { font-family: var(--f-disp); font-weight: 800; font-size: 26px; letter-spacing: .06em; line-height: 1; white-space: nowrap; }
.compact .brand { font-size: 18px; }
.brand span { color: var(--brass); }
.clock { display: grid; gap: 2px; width: 210px; }
.compact .clock { width: 150px; gap: 1px; }
.clock .ct { display: flex; justify-content: space-between; align-items: baseline; font-size: 10px; color: var(--muted); }
.clock .ct b { color: var(--fg); font-family: var(--f-body); font-weight: 700; font-size: 19px; letter-spacing: .02em; line-height: 1.1; }
.compact .clock .ct b { font-size: 15px; }
.clock .track { height: 3px; }
.track { position: relative; height: 6px; background: var(--panel2); border-radius: 3px; }
.track i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--brass); border-radius: 3px; }
.track .tk { position: absolute; top: -3px; width: 2px; height: 12px; background: var(--fg); opacity: .7; }
.clock .step { font-size: 10px; color: var(--muted); }
.compact .clock .step { display: none; }
.sp { flex: 1; }
.hv { display: grid; line-height: 1.1; }
.hv small { font-size: 10px; color: var(--muted); }
.hv b { font-family: var(--f-num); font-size: 18px; font-weight: 600; }
.compact .hv small { display: none; }
.compact .hv b { font-size: 15px; }
.ibtn { min-width: 44px; height: 40px; padding: 0 10px; border-radius: 6px; border: 1px solid var(--line); background: var(--panel2); display: inline-flex; align-items: center; justify-content: center; gap: 6px; font-size: 12px; }
.compact .ibtn { height: 34px; min-width: 40px; padding: 0 8px; }
.ibtn:hover:not(:disabled) { border-color: var(--brass); }
.ibtn:disabled { opacity: .4; cursor: not-allowed; }
.ibtn.on { border-color: var(--brass); color: var(--brass2); }

/* map */
.map { position: absolute; left: 0; right: 0; top: var(--top); bottom: var(--tray); }
.map svg.terrain { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
#fx { position: absolute; left: 0; top: 0; pointer-events: none; }
.cap { position: absolute; transform: translate(-50%, -50%); display: grid; justify-items: center; gap: 4px; pointer-events: none; }
.cap .dot { width: 36px; height: 36px; border-radius: 50%; background: var(--bg); border: 3px solid currentColor; display: grid; place-items: center; }
.compact .cap .dot { width: 26px; height: 26px; }
.cap span { font-size: 12px; color: var(--fg); text-shadow: 0 1px 2px #000; white-space: nowrap; }
.compact .cap span { display: none; }
.pill { position: absolute; top: 8px; transform: translateX(-50%); display: flex; gap: 6px; align-items: center; padding: 4px 10px; border-radius: 999px; background: var(--bg); border: 1px solid var(--brass); font-family: var(--f-num); font-size: 12px; white-space: nowrap; transition: left .4s linear; }
.pill .pa { color: var(--a2); } .pill .pb { color: var(--b2); } .pill .pm { color: var(--muted); font-family: var(--f-body); }
.ship { position: absolute; bottom: 8px; display: flex; flex-wrap: wrap; gap: 4px; max-width: 300px; }
.compact .ship { display: none; }
.ship span { font-family: var(--f-num); font-size: 11px; padding: 2px 8px; border-radius: 4px; background: var(--bg); border: 1px solid var(--brass); color: var(--brass2); white-space: nowrap; }

/* state cards */
.card { position: absolute; top: 12px; width: 300px; padding: 10px 12px; background: rgba(20, 23, 26, .93); border: 1px solid var(--line); border-radius: 6px; display: grid; gap: 7px; }
.compact .card { top: 8px; width: 214px; padding: 7px 9px; gap: 5px; }
.card.A { left: 14px; border-top: 3px solid var(--a); } .card.B { right: 14px; border-top: 3px solid var(--b); }
.compact .card.A { left: 8px; } .compact .card.B { right: 8px; }
.ch { display: flex; align-items: center; gap: 6px; }
.ch .nm { font-family: var(--f-disp); font-weight: 800; font-size: 22px; letter-spacing: .04em; line-height: 1; }
.compact .ch .nm { font-size: 17px; }
.A .nm { color: var(--a2); } .B .nm { color: var(--b2); }
.flags { display: flex; flex-wrap: wrap; gap: 4px; flex: 1; justify-content: flex-end; }
.scn { display: grid; gap: 8px; margin-top: 10px; }
.scn .btn { display: grid; gap: 3px; text-align: left; padding: 10px 12px; }
.scn .btn span { font-size: 12px; color: var(--muted); }
.scn .btn.primary span { color: inherit; opacity: .8; }
.flag { font-size: 10.5px; padding: 1px 6px; border-radius: 3px; background: var(--panel2); color: var(--muted); white-space: nowrap; }
.flag.bad { background: #43231f; color: #f0c2ba; } .flag.good { background: #2b3a2d; color: #b9d8bd; }
.more { display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 3px; border: 1px solid var(--line); background: var(--panel2); }
.card.open .more { border-color: var(--brass); color: var(--brass2); }
.gg { display: grid; grid-template-columns: 18px 34px minmax(0, 1fr) 54px; gap: 5px 7px; align-items: center; }
.compact .gg { grid-template-columns: 30px minmax(0, 1fr) 42px; gap: 3px 6px; }
.compact .gg svg { display: none; }
.card:not(.open) .det { display: none; }
.gg .lb.em { color: var(--fg); font-weight: 700; font-size: 14px; }
.gg .v.em { font-size: 15px; font-weight: 600; }
.gg .bar.em { height: 11px; }
.gg .lb:not(.em), .gg .v:not(.em) { font-size: 11.5px; }
.gg .bar:not(.em) { height: 6px; }
.compact .gg .lb.em { font-size: 12.5px; } .compact .gg .v.em { font-size: 13px; } .compact .gg .bar.em { height: 8px; }
.gg .lb { color: var(--muted); }
.gg .v { font-family: var(--f-num); text-align: right; white-space: nowrap; }
.gg .v[data-full] { text-decoration: underline dotted rgba(221, 216, 203, .35); text-underline-offset: 3px; cursor: help; }
.bar { position: relative; height: 8px; background: var(--panel2); border-radius: 2px; overflow: hidden; }
.compact .bar { height: 6px; }
.bar i { position: absolute; top: 0; bottom: 0; left: 0; border-radius: 2px; transition: width .3s linear, left .3s linear; }
.bar .tk { position: absolute; top: 0; bottom: 0; width: 1px; background: var(--fg); opacity: .55; }
.comp { display: grid; gap: 3px; }
.comp .cl { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); }
.comp .stk { display: flex; height: 8px; gap: 2px; border-radius: 2px; overflow: hidden; }
.comp .stk i { display: block; height: 100%; transition: width .3s linear; }
.sub { display: flex; justify-content: space-between; gap: 6px; font-size: 11px; color: var(--muted); }
.sub b { font-family: var(--f-num); font-weight: 500; color: var(--fg); }
.acts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; }
.acts button { height: 44px; border-radius: 5px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 6px; }
.compact .acts button { height: 38px; }
.A .acts button { border: 1px solid var(--a3); background: #1e2a36; }
.B .acts button { border: 1px solid var(--b3); background: #33201c; }
.acts button:hover:not(:disabled) { border-color: var(--brass); }
.acts button:disabled { opacity: .4; cursor: not-allowed; }
.A .acts svg { stroke: var(--a2); } .B .acts svg { stroke: var(--b2); }
.dbg { border-top: 1px dashed var(--line); padding-top: 4px; font-size: 11px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 2px 10px; }
.dbg b { color: var(--brass2); font-family: var(--f-num); font-weight: 500; }

/* tray */
.tray { position: absolute; left: 0; right: 0; bottom: 0; height: var(--tray); padding: 10px 16px; background: var(--ink); border-top: 1px solid var(--line); display: flex; gap: 18px; }
.compact .tray { padding: 6px 10px; gap: 10px; align-items: center; }
.tl { font-size: 11px; color: var(--muted); letter-spacing: .1em; margin-bottom: 6px; }
.compact .tl { display: none; }
.stock { display: flex; gap: 8px; }
.compact .stock { gap: 6px; }
.slot { width: 140px; height: 76px; padding: 7px 8px; border-radius: 6px; background: var(--panel); border: 1px solid var(--line); display: grid; grid-template-rows: auto 1fr auto; gap: 3px; text-align: left; }
.compact .slot { width: 104px; height: 40px; padding: 3px 7px; grid-template-columns: minmax(0, 1fr) auto; grid-template-rows: auto auto; gap: 0 6px; }
.slot.off { border-color: var(--brass); }
.slotw { position: relative; }
.fcan { position: absolute; right: 6px; bottom: 10px; z-index: 1; font-size: 10px; padding: 1px 6px; border-radius: 3px; border: 1px solid var(--bad2); background: #43231f; color: #f0c2ba; }
#sl_food .st { background: #2a2f36; color: var(--brass2); }
.slot .sn { display: flex; justify-content: space-between; align-items: center; font-size: 12px; font-weight: 700; gap: 4px; }
.compact .slot .sn { font-size: 11px; }
.slot .st { font-size: 10px; padding: 1px 6px; border-radius: 3px; background: #2b3a2d; color: #b9d8bd; font-weight: 400; }
.slot.off .st { background: #43231f; color: #f0c2ba; }
.compact .slot .st { display: none; }
.compact .fcan { bottom: auto; top: -8px; right: -4px; font-size: 9px; padding: 0 4px; }
.slot .cnt { font-family: var(--f-num); font-size: 24px; font-weight: 600; line-height: 1; align-self: center; }
.compact .slot .cnt { font-size: 16px; grid-column: 2; grid-row: 1 / 3; }
.slot.off .cnt { color: var(--brass2); }
.slot .pg { height: 4px; background: var(--bg); border-radius: 2px; overflow: hidden; }
.slot .pg i { display: block; height: 100%; background: var(--brass); }
.wire { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.wire ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 3px; }
.wire li { display: flex; gap: 10px; font-size: 13.5px; line-height: 1.45; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.compact .wire li { font-size: 11px; }
.compact .wire li:nth-child(n+4) { display: none; }
.compact .wire ul { gap: 1px; }
.wire li .t { font-family: var(--f-num); color: var(--muted); flex: none; font-size: 11px; padding-top: 1px; }
.wire li .x { overflow: hidden; text-overflow: ellipsis; }
.wire li.intel .x { color: var(--brass2); } .wire li.event .x { color: #e8cf96; } .wire li.bad .x { color: var(--bad2); } .wire li.op .x { color: #b9a3d6; } .wire li.sale .x { color: var(--fg); }

/* tooltip */
#tip { position: absolute; z-index: 40; padding: 4px 8px; border-radius: 4px; background: var(--fg); color: var(--bg); font-family: var(--f-num); font-size: 12px; white-space: nowrap; pointer-events: none; transform: translate(-50%, -100%); }

/* modal (inside stage) */
.modal { position: absolute; inset: 0; z-index: 30; background: rgba(16, 19, 21, .78); display: grid; place-items: center; padding: 12px; }
.mc { background: var(--panel); border: 1px solid var(--line); border-top: 3px solid var(--brass); border-radius: 6px; padding: 18px 20px; width: min(640px, 100%); max-height: 100%; overflow-y: auto; display: grid; gap: 11px; }
.compact .mc { padding: 12px 14px; gap: 8px; width: min(700px, 100%); }
.mc.A { border-top-color: var(--a); } .mc.B { border-top-color: var(--b); }
.mc h2 { margin: 0; font-family: var(--f-disp); font-size: 26px; letter-spacing: .04em; color: var(--brass); text-wrap: balance; line-height: 1.15; }
.compact .mc h2 { font-size: 20px; }
.mc.A h2 { color: var(--a2); } .mc.B h2 { color: var(--b2); }
.mc p { margin: 0; line-height: 1.7; }
.mc ul { margin: 0; padding-left: 1.2em; display: grid; gap: 4px; line-height: 1.6; }
.stamp { font-size: 11px; letter-spacing: .12em; color: var(--muted); }
.kv { display: flex; flex-wrap: wrap; gap: 3px 14px; font-size: 12px; color: var(--muted); }
.kv b { color: var(--fg); font-family: var(--f-num); font-weight: 600; }
.picks { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.compact .picks { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
.pick { text-align: left; background: var(--panel2); border: 1px solid var(--line); border-radius: 4px; padding: 8px; display: grid; gap: 2px; }
.compact .pick { padding: 6px; }
.pick.sel { border-color: var(--brass); box-shadow: inset 0 0 0 1px var(--brass); }
.pick .pn { font-weight: 700; display: flex; justify-content: space-between; gap: 6px; }
.pick .pl { font-size: 11px; color: var(--muted); }
.compact .pick .pl.tr { display: none; }
.pick .pe { font-size: 12px; color: var(--brass2); font-family: var(--f-num); }
.priceline { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 14px; }
.priceline .mult { font-family: var(--f-num); font-size: 26px; font-weight: 600; color: var(--brass); }
.compact .priceline .mult { font-size: 20px; }
.priceline .yen { font-family: var(--f-num); font-size: 16px; }
input[type=range] { width: 100%; accent-color: var(--brass); margin: 0; }
#mRange { -webkit-appearance: none; appearance: none; height: 34px; background: transparent; cursor: pointer; }
#mRange::-webkit-slider-runnable-track { height: 12px; background: var(--panel2); border: 1px solid var(--line); border-radius: 6px; }
#mRange::-webkit-slider-thumb { -webkit-appearance: none; width: 28px; height: 28px; margin-top: -9px; border-radius: 50%; background: var(--brass); border: 3px solid var(--bg); }
#mRange::-moz-range-track { height: 12px; background: var(--panel2); border: 1px solid var(--line); border-radius: 6px; }
#mRange::-moz-range-thumb { width: 24px; height: 24px; border-radius: 50%; background: var(--brass); border: 3px solid var(--bg); }
.quick { display: flex; flex-wrap: wrap; gap: 6px; }
.btn { background: var(--panel2); border: 1px solid var(--line); border-radius: 4px; padding: 6px 12px; min-height: 36px; }
.btn:hover:not(:disabled) { border-color: var(--brass); }
.btn:disabled { opacity: .4; cursor: not-allowed; }
.btn.primary { background: var(--brass); color: #1a1508; border-color: var(--brass); font-weight: 700; }
.quick .btn { padding: 3px 10px; font-size: 12px; min-height: 32px; }
.mg { display: grid; grid-template-columns: 92px minmax(0, 1fr) 76px; gap: 5px 10px; align-items: center; padding: 10px 12px; border-radius: 4px; background: #191b1d; border: 1px solid var(--line); }
.compact .mg { grid-template-columns: 74px minmax(0, 1fr) 64px; gap: 3px 8px; padding: 6px 8px; }
.mg .ml { font-size: 12px; color: var(--muted); }
.mg .mv { font-family: var(--f-num); font-size: 12px; text-align: right; white-space: nowrap; }
.mg .mh { grid-column: 1 / -1; font-size: 11px; letter-spacing: .1em; color: var(--muted); border-top: 1px solid var(--line); padding-top: 4px; margin-top: 2px; }
.mg .mh:first-child { border-top: 0; padding-top: 0; margin-top: 0; }
.mg .mflags { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 4px; }
.mstk { display: flex; height: 8px; gap: 2px; border-radius: 2px; overflow: hidden; }
.mstk i { display: block; height: 100%; }
.mlog { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; max-height: 120px; overflow-y: auto; font-size: 12px; }
.mlog li { padding: 3px 8px; border-left: 2px solid var(--line); }
.mlog li.ok { border-left-color: var(--good); } .mlog li.ng { border-left-color: var(--bad); color: var(--bad2); }
.resp { font-size: 14px; padding: 8px 10px; border-radius: 4px; background: var(--panel2); }
.resp:empty { display: none; }
.resp.ok { border-left: 3px solid var(--good); } .resp.ng { border-left: 3px solid var(--bad); }
.foot { display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-end; }
.oprow { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; align-items: center; padding: 7px 0; border-bottom: 1px solid var(--panel2); }
.oprow .on { font-weight: 700; }
.oprow .od { font-size: 12px; color: var(--muted); }
.oprow .why { font-size: 11px; color: var(--bad2); }
.ctgrid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.ctgrid .btn { display: grid; gap: 2px; padding: 8px; text-align: center; }
.ctgrid .btn small { font-size: 11px; color: var(--muted); }
.res { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px 16px; }
.res div { display: flex; justify-content: space-between; border-bottom: 1px solid var(--panel2); padding: 3px 0; font-size: 13px; }
.res div span:first-child { color: var(--muted); }
.big { font-family: var(--f-num); font-size: 34px; font-weight: 600; line-height: 1.1; }
.review { display: grid; gap: 6px; }
.review div { padding: 8px 10px; border-radius: 4px; background: var(--panel2); border-left: 3px solid var(--brass); font-size: 13px; line-height: 1.6; }
.review div.good { border-left-color: var(--good); }
.chartbox svg { width: 100%; height: auto; display: block; }

#rotate { position: fixed; inset: 0; z-index: 50; background: var(--bg); display: grid; place-items: center; text-align: center; padding: 24px; }
#rotate .in { display: grid; gap: 14px; justify-items: center; max-width: 320px; }
/* 崩壊の危険 */
.risk { font-size: 11.5px; font-weight: 600; padding: 4px 8px; border-radius: 4px; line-height: 1.35; }
.risk.lv1 { background: #3d3216; color: #f0d9a0; border: 1px solid #8a6d2a; }
.risk.lv2 { background: #4a1f1a; color: #ffd0c8; border: 1px solid var(--bad); animation: pulse 1.6s ease-in-out infinite; }
.compact .risk { font-size: 10.5px; padding: 3px 6px; }
@media (prefers-reduced-motion: reduce) { .risk.lv2 { animation: none; } }
.hsep { width: 1px; height: 26px; background: var(--line); margin: 0 6px 0 10px; }
.compact .hsep { margin: 0 2px 0 6px; }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .35; } }
.bar.danger { box-shadow: 0 0 0 1px var(--bad); }
.bar.danger i { animation: pulse 1.2s ease-in-out infinite; }
.gg .v.danger { color: var(--bad2) !important; font-weight: 600; }
.card.alert { border-color: var(--bad); }
.effs { position: absolute; top: 44px; left: 50%; transform: translateX(-50%); display: grid; gap: 4px; justify-items: center; pointer-events: none; max-width: 560px; }
.compact .effs { top: 36px; gap: 2px; max-width: 420px; }
.effs span { padding: 3px 10px; border-radius: 4px; background: rgba(20, 23, 26, .92); border: 1px solid var(--line); font-size: 12px; white-space: nowrap; }
.compact .effs span { font-size: 10.5px; padding: 2px 8px; }
.effs span.ord { border-color: var(--brass); color: var(--brass2); }
.effs span.pol { border-color: #7d6aa0; color: #cbbbe6; }
.effs span.mod { border-color: var(--warn); color: #f0c493; }
.effs span.pre { border-color: var(--line); color: var(--brass2); }
.effs span.bad { border-color: var(--bad); background: rgba(74, 31, 26, .95); color: #ffd0c8; font-weight: 600; }
.effs span.end { opacity: .55; border-style: dashed; }
.ledger { display: grid; gap: 4px; padding: 10px 12px; border-radius: 4px; background: #191b1d; border: 1px solid var(--line); }
.ledger div { display: flex; justify-content: space-between; gap: 12px; font-size: 13px; padding: 2px 0; }
.ledger div span:first-child { color: var(--muted); flex: none; }
.ledger div b { font-family: var(--f-num); font-weight: 500; text-align: right; }

  function transitSum(c) { return c.transit.reduce((s, x) => s + x.n, 0); }
  function syncSoldiers(c) { c.soldiers = c.reserve + c.front + transitSum(c); }
  function tl(g, what, why, kind) { g.tl.push({ t: g.t, what, why: why || '', kind: kind || 'state' }); if (g.tl.length > 120) g.tl.shift(); }
  // 状態の変化を検知して、因果の履歴に残す
  function milestones(g) {
    for (const c of [g.c.A, g.c.B]) {
      const m = c.ms || (c.ms = {});
      // once: 何度も行き来する項目は、初めての時だけ記録する
      const flag = (key, on, onText, onWhy, offText, offWhy, once) => {
        if (on && !m[key]) { m[key] = true; if (!once || !m[key + '_on']) { m[key + '_on'] = true; tl(g, onText, onWhy); } }
        else if (!on && m[key]) { m[key] = false; if (offText && (!once || !m[key + '_off'])) { m[key + '_off'] = true; tl(g, offText, offWhy); } }
      };
      const ss = selfSuff(g, c), dem = demand(g, c), sh = shareOf(g, c.id);
      flag('nomorale', c.morale < CFG.peaceLine, c.name + 'の戦意が初めて25を下回った。', c.name + 'は武器を買わなくなった(相場の3割以下なら受け取る)', c.name + 'の戦意が初めて25以上に戻った。', c.name + 'は再び武器を買うようになった', true);
      if ((c.seenSusp || 0) >= 10) { tl(g, c.name + 'は、敵国の前線で同型の装備が使われていることに気付いた。', '相手国への納品が見えるたびに、' + c.name + 'の疑惑度が上がる(合計 +' + Math.round(c.seenSusp) + ')'); c.seenSusp = 0; }
      flag('warn', c.susp >= 50, c.name + 'の疑惑度が50を超えた。', c.name + 'は値引きを求めるようになった', c.name + 'の疑惑度が50を下回った。', '値引きの要求が止んだ');
      flag('stop', c.susp >= 80, c.name + 'の疑惑度が80を超えた。', c.name + 'との取引が止まった(膠着時の破格は例外)', c.name + 'の疑惑度が80を下回った。', c.name + 'との取引が再開できる');
      flag('noneed', c.noNeed && c.morale >= CFG.peaceLine, c.name + 'の装備が初めて十分に揃った(装備充足率135%超)。', c.name + 'は武器を必要としなくなった(相場の5割以下なら買う)', c.name + 'が初めて再び武器を求め始めた。', '装備の損耗で充足率が115%を下回った', true);
      flag('finish', sh > 0.65 && c.antiwar > 50 && c.morale >= CFG.peaceLine, c.name + 'が圧倒的優勢のまま、反戦感情が50を超えた。', c.name + 'は早期終結を望み、武器を求めるようになった');
      flag('food70', c.foodLv < 70, c.name + 'の兵糧が70%を下回った。', '戦意の低下と出動の鈍化が目に見えて強まる', c.name + 'の兵糧が70%以上に戻った。', '兵糧の不足が和らいだ');
      flag('food', c.foodLv < 90, c.name + 'の兵糧が90%を下回った。', '兵糧の相場が1.3倍になった。戦意と出動の勢いの落ち込みが強まっていく', c.name + 'の兵糧が90%以上に戻った。', '兵糧の不足が和らいだ');
      flag('sortie', c.sortieRate * 3 < 250 && !c.massing, c.name + 'の出動の勢いが初めて細った(毎週250人未満)。', '予備の不足・戦意の低下・兵糧不足のいずれかが原因。前線の補充が追いつかなくなる', c.name + 'の出動の勢いが初めて回復した。', '前線への補充が再開した', true);
      flag('mass', c.massing, c.name + 'が首都に兵を集結させ始めた。', '反戦感情が高まり、早く終わらせるための総攻撃の準備');
    }
  }
  function news(g, text, kind) { g.news.unshift({ t: g.t, text, kind: kind || 'info' }); if (g.news.length > 60) g.news.pop(); }
  function schedule(g, at, fn) { g.sched.push({ at, fn }); }

  // 品目ごとの不足感: 編成で足りない装備ほど高く評価する
  function crewFill(c) { return c.crew > 0 ? c.soldiers / c.crew : 9; }
  function itemBonus(c, item) {
    if (!item) return 0;
    const it = ITEMS[item];
    const f = crewFill(c);
    if (!it.type) {
      // 傭兵: 充足率110%以下で相場が上がり、120%前後で通常、それ以上は人が余っていて安くなる
      if (f <= 1.1) return clamp((1.1 - f) * 1.5, 0, 0.6);
      if (f <= 1.2) return 0;
      return -clamp((f - 1.2) / 0.3 * 0.25, 0, 0.25);
    }

    // 装備: 充足率95%を切ると、扱う人がいないため相場が落ちる
    const lack = f < 0.95 ? -clamp((0.95 - f) * 1.5, 0, 0.5) : 0;
    return lack;
  }
  function fairMult(g, c, item) {
    if (item === 'food') { let f = foodMult(c); if (c.susp >= 50) f *= 0.8; if (g.t < c.priceModUntil) f *= c.priceMod; return f; }
    const D = demand(g, c);
    const wealth = CFG.wWealth * clamp((c.funds - 1000000) / 3000000, 0, 1);
    let f = CFG.fBase + CFG.fNeed * D + wealth + (c.morale - 50) / 300 + itemBonus(c, item) + pol(c).price;
    f = CFG.stretchC + (f - CFG.stretchC) + CFG.stretchA * CFG.stretchW * Math.tanh((f - CFG.stretchC) / CFG.stretchW); // 中央(1.1倍)付近ほど動きを大きくする
    if (c.susp >= 50) f *= 0.8;
    if (item) f -= buyImpact(c, item); // 司令部が買った量を把握し、同じ品目を続けて買うほどその品目の相場が下がる
    if (g.t < c.priceModUntil) f *= c.priceMod;
    return clamp(f, 0.4, 2);
  }
  // 需要: 劣勢ほど高く、優勢ほど低い。超優勢かつ反戦感情が高いと「早く終わらせたい」で再び高まる
  // 需要(危機感): 押されている・相手に武器が届いている(警戒)・損耗が大きいほど高い。最近受け取った分だけ一時的に満たされる
  // 装備充足率: 司令部が必要と考える装備(開戦時の装備が基準)に対して、いまどれだけ持っているか。必要かどうかの判断に使う
  function eqTarget(g, c) { return c.initPower * CFG.eqNeed; }
  function eqSuff(g, c) { return c.power / eqTarget(g, c); }
  // 危機感(相場の高さ): 押されている・相手国に武器が届いて警戒している・兵の損耗が大きい・早く終わらせたい
  function needParts(g, c) {
    const s = shareOf(g, c.id);
    const losing = clamp((0.6 - s) / 0.25, 0, 1);
    const alarm = c.threat / 100;
    const loss = clamp(1 - c.front / (c.initSoldiers * 0.5), 0, 1);
    const finish = (s > 0.65 && c.antiwar > 50) ? (c.antiwar - 50) / 50 * 0.6 : 0;
    return { losing, alarm, loss, finish };
  }
  // 同じ品目を続けて買うほど、その品目の相場が下がる(1回目:1、2回目:4、3回目:9…の割合)。高い品目ほど影響が大きい
  const BUYK = { equip: 0.012, merc: 0.0167, food: 0 };
  function buyImpact(c, item) { const n = c.bought[item] || 0; return BUYK[item] * n * n; }
  // 需要(相場の高さ)。必要かどうかは装備充足率で別に判断する
  function demand(g, c) {
    const p = needParts(g, c);
    const raw = Math.max(0, CFG.needBase + CFG.wLose * p.losing + CFG.wAlarm * p.alarm + 0.4 * p.loss + p.finish);
    return 1.25 * Math.tanh(raw / 0.8);
  }


  // 相場の段階表示(兵糧以外)。数値ではなく言葉で示す
  const PLABEL = [[0.6, '大幅な値崩れ', 0.5], [0.8, '値崩れ', 0.7], [0.9, 'やや安い', 0.85], [1.1, 'ほぼ定価', 1.0], [1.3, '少し高騰', 1.2], [1.5, '高騰', 1.4], [9, '大高騰', 1.6]];
  function priceBand(m) { for (const b of PLABEL) if (m < b[0]) return { label: b[1], mid: b[2] }; return { label: '大高騰', mid: 1.6 }; }
  function priceLabel(g, c, item) { return priceBand(estimate(g, c, item)); }
  function estimate(g, c, item) {
    if (item === 'food') return fairMult(g, c, item); // 兵糧の相場は備蓄の段階で決まり、正確に分かる
    return fairMult(g, c, item) * (1 + c.estNoise);
  }

  // 定価の段階上昇: 80週1.1倍・100週1.2倍・120週1.3倍(実時間4/5/6分)。生産費は元の定価基準のまま
  // 定価の見直し: 2年目3月・2年目9月・3年目4月。その時点でどちらの国も戦意を失っていなければ0.1倍ずつ上がる
  const PRICE_CHECKS = [168, 240, 324];
  function priceStep(g) { return g.pl || 1; }
  function nextPriceCheck(g) { return PRICE_CHECKS[g.plIdx || 0]; }
  function listPrice(g, item) { return Math.round(ITEMS[item].price * priceStep(g)); }
  // 兵糧の自給率: 農業力(市民数と時間で低下)÷兵士数。100%を下回ると外部の兵糧が必要
  // 兵糧: 農業で賄えない分だけ備蓄(foodLv)が減る。1単位で軍人10万人あたり30%回復
  function foodRestore(c) { return 30 * CFG.foodRef / Math.max(1, c.soldiers); }
  function foodPen(c) { return c.foodLv >= 100 ? 0 : Math.min(3, Math.pow((100 - c.foodLv) / 30, 2)); } // 70%で1、なだらかに強まる(上限3)
  function foodMult(c) { const f = c.foodLv; return f >= 90 ? 1.0 : f >= 70 ? 1.3 : f >= 60 ? 1.8 : 2.0; }
  function selfSuff(g, c) {
    const farm = c.farmCap * Math.max(0.2, 1 - CFG.farmDecay * g.t);
    return c.soldiers > 0 ? farm / c.soldiers : 9;
  }
  function shortage(g, c) { return clamp(1 - selfSuff(g, c), 0, 1); }
  function foodIncome(g, c, mult) { return c.soldiers * shortage(g, c) * CFG.foodRate * priceStep(g) * mult; }
  function contract(g, cid, mult) { return { ok:false, text:'兵糧は倉庫から販売します。' }; }


  function costRate(k) { return CFG.cost[k]; } // 原価(定価に対する割合)
  function take(g, item) { g.inv[item]--; if (item === 'food') g.foodLots.shift(); }
  function deliver(g, c, item) {
    const it = ITEMS[item];
    const at = g.t + it.lag;
    c.pipeline.push({ at, item, value: it.price });
  }

  // 1週間に受け付ける発注の数(調達の処理能力)
  const SUSM = { equip: 2, merc: 3, food: 1 };
  // 値引き・無償供与の効き目: 疑惑度と戦意で別々に札を持つ。1回ごとに3週の札が付き、古い札から1枚ずつ消える
  // 残っている札の数で効き目が決まる(100・50・25・12.5%)。札が3枚ある時に重ねると、3枚の期限を今から3・6・9週に引き直す
  const DISC_EFF = [1, 0.5, 0.25, 0.125], DISC_CD = 9;
  function discQ(c, k) { const d = c.disc || (c.disc = { s: [], m: [] }); return d[k]; }
  function discEff(g, c, k) { const q = discQ(c, k); while (q.length && q[0] <= g.t) q.shift(); return DISC_EFF[Math.min(q.length, 3)]; }
  function discAdd(g, c, k) { const q = discQ(c, k); while (q.length && q[0] <= g.t) q.shift();
    if (q.length >= 3) { q.length = 0; q.push(g.t + DISC_CD, g.t + DISC_CD * 2, g.t + DISC_CD * 3); }
    else q.push(Math.max(q.length ? q[q.length - 1] : g.t, g.t) + DISC_CD); }
  // 値引き・無償供与の効果を適用する(疑惑度の下げ幅と戦意の上げ幅)。2回目以降で効き目が落ちていれば weak
  function discApply(g, c, sBase, mBase) {
    const es = sBase > 0 ? discEff(g, c, 's') : 1, em = mBase > 0 ? discEff(g, c, 'm') : 1;
    const ds = scaled(sBase, es), dm = scaled(mBase, em);
    if (sBase > 0) discAdd(g, c, 's'); if (mBase > 0) discAdd(g, c, 'm');
    // 戦意は満額で疑惑度だけ薄れた時は「少し薄かった」。それ以外で薄れた時は「薄かった」
    const note = (es < 1 || em < 1) ? (mBase > 0 && em === 1 ? '効果は少し薄かった' : '効果は薄かった') : '';
    return { ds, dm, weak: !!note, note };
  }
  // 売上の内訳: 原価より高く売れた分と、原価以下で渡した分(無償供与を含む)
  function book(g, c, item, price) {
    const cost = ITEMS[item].price * costRate(item), a = g.acct || (g.acct = { gainRev: 0, gain: 0, lossRev: 0, loss: 0 });
    if (price > cost) { a.gainRev += price; a.gain += price - cost; } else { a.lossRev += price; a.loss += cost - price; }
    const b = c.salesBy || (c.salesBy = { equip: { n: 0, v: 0, free: 0 }, merc: { n: 0, v: 0, free: 0 }, food: { n: 0, v: 0, free: 0 } });
    b[item].n++; b[item].v += price; if (price <= 0) b[item].free++;
  }
  const scaled = (v, e) => Math.ceil(v * e - 1e-9); // 小数点以下は切り上げ
  const sm = (v, item) => Math.sign(v) * Math.round(Math.abs(v) * SUSM[item]);
  function sell(g, cid, item, mult) {
    const c = g.c[cid], it = ITEMS[item];
    if (g.over) return { ok:false, text:'' };
    if (g.inv[item] < 1) return { ok:false, tier:'none', text: it.name + 'の在庫がありません。' };
    mult = Math.round(mult * 100) / 100;
    if (mult <= 0) {
      // 無償供与: 疑惑度が大きく下がり、受け取った国の戦意が持ち直す
      take(g, item); deliver(g, c, item); g.stats.free++; g.supplied[item]++;
      const da = discApply(g, c, 4 * SUSM[item], 8), d = da.ds, mo = da.dm, en = da.weak ? '。' + da.note + '。' : ''; book(g, c, item, 0);
      c.susp = clamp(c.susp - d, -100, 100); c.morale = clamp(c.morale + mo, 0, 100); c.antiwar = clamp(c.antiwar - 2, 0, 100);
      news(g, c.name + 'へ' + it.name + '(' + it.lot + ')を無償供与。疑惑度 -' + d.toFixed(0) + '、戦意 +' + mo + (da.weak ? '。' + da.note : ''), 'sale');
      tl(g, 'あなたは' + c.name + 'へ' + it.name + 'を無償供与した。' + (da.weak ? da.note + '。' : ''), c.name + 'の疑惑度 -' + d.toFixed(0) + '、戦意 +' + mo, 'act');
      return { ok:true, tier:'free', text: c.name + 'は無償供与を受け取った。疑惑度 -' + d.toFixed(0) + '、戦意 +' + mo + '、反戦感情 -2' + en };
    }
    const price = Math.round(listPrice(g, item) * mult);
    const ratio = mult / fairMult(g, c, item);
    const own = shareOf(g, c.id), stalemate = own > 0.38 && own < 0.62;
    // 大幅な値引きは、通常なら断られる状況でも受け取られる
    let bypass = '';
    if (c.susp >= 80) { if (ratio <= 0.4 && stalemate) bypass = '取引停止中だが、膠着した戦況で破格の申し出を受け入れた'; else { g.stats.stop++; return { ok:false, tier:'stop', text: c.name + 'は取引を停止している(疑惑度80以上)。戦況が膠着していれば、相場の4割以下の破格なら受け取る。' }; } }
    if (c.morale < CFG.peaceLine) { if (ratio <= 0.3) bypass = bypass || '戦う意思を失いかけていたが、破格の支援を受け取った'; else { g.stats.nomorale++; return { ok:false, tier:'nomorale', text: c.name + 'に購入の意思がない(戦意25未満)。相場の3割以下なら受け取る。' }; } }
    const noNeed = item === 'food' ? c.foodLv >= CFG.foodFull : item === 'equip' ? c.noNeed : false;
    if (noNeed) { if (ratio <= 0.5) bypass = bypass || '必要としていなかったが、安さにつられて買った'; else { g.stats.noneed++; news(g, c.name + 'は「今は必要ない」と' + it.name + 'の購入を見送った。', 'bad'); return { ok:false, tier:'noneed', text: item === 'food' ? c.name + 'は兵糧が十分にあり(130%以上)、今は必要としていない。相場の5割以下なら買う。' : c.name + 'は装備が十分に揃っており、今は武器を必要としていない。相場の5割以下なら買う。' }; } }
    if (c.funds < price) { g.stats.nofunds++; return { ok:false, tier:'nofunds', text: c.name + 'は資金が足りない。' }; }
    let tier, ds, dm = 0, label;
    // 信頼(マイナスの疑惑度)があると、相場より高い価格も受け入れる。快く買っても信頼は少し消費される
    // 同じ価格なら、信頼が厚いほど疑惑度の上昇は小さい(逆転しない)
    const trust = -c.susp;
    const rich = c.funds >= CFG.richLine;
    const band = trust >= 40 ? { w: 1.45, r: 1.6, w1: 1, w2: 3, rd: 6 } : trust >= 15 ? { w: 1.3, r: 1.45, w1: 1, w2: 1, rd: 4 } : rich ? { w: 1.2, r: 1.4, w1: 0, w2: 0, rd: 2, rich: true } : { w: CFG.bandW, r: CFG.bandR, w1: 0, w2: 0, rd: 2 };
    if (ratio > band.r) { tier = 'refuse'; ds = 2; label = '買わない'; }
    else if (ratio > band.w) { tier = 'reluctant'; ds = band.rd; label = 'しぶしぶ買う'; }
    else if (ratio > 1.1) { tier = 'willing'; ds = ratio > 1.3 ? band.w2 : band.w1; label = band.rich ? '資金に余裕があり普通に買う' : '信頼から快く買う'; }
    else if (ratio >= 0.9) { tier = 'normal'; ds = 0; label = '普通に買う'; }
    else if (ratio >= 0.7) { tier = 'grateful'; ds = -2; label = 'ありがたく買う'; }
    else if (ratio > 0.4) { tier = 'thanks'; ds = -2; dm = 3; label = '感謝される'; }
    else { tier = 'debt'; ds = -3; dm = 4; label = '恩義を感じる'; }
    let weak = false, wnote = '';
    if (ds < 0) { const da = discApply(g, c, -ds * SUSM[item], dm); ds = -da.ds; dm = da.dm; weak = da.weak; wnote = da.note; } // 値引きの効き目は続けるほど薄れる
    else ds = sm(ds, item); c.susp = clamp(c.susp + ds, -100, 100); c.morale = clamp(c.morale + dm, 0, 100);
    const sTxt = (ds === 0 ? '' : '(疑惑度 ' + (ds > 0 ? '+' : '') + ds + (dm ? '、戦意 +' + dm : '') + ')') + (weak ? '。' + wnote : '');
    if (tier === 'refuse') {
      g.stats.refuse++;
      news(g, c.name + 'は' + it.name + 'の購入を拒否した ×' + mult.toFixed(1) + sTxt, 'bad');
      return { ok:false, tier, text: c.name + ': ' + label + sTxt };
    }
    take(g, item); if (item === 'food') g.foodRev += price; g.money += price; g.revenue += price; g.sales++; g.supplied[item]++; c.sold.push({ t: g.t, v: price, k: item }); c.bought[item] += 1; c.lastDeal[item] = { m: mult, t: g.t, tier, label }; // 前回の成約(画面に表示する)
    c.funds -= price; deliver(g, c, item); book(g, c, item, price);
    news(g, c.name + 'が' + it.name + '(' + it.lot + ')を' + fmt(price) + 'で購入: ' + label + sTxt, 'sale');
    if (bypass) tl(g, c.name + 'は' + bypass + '(' + it.name + ' ×' + mult.toFixed(2) + ')。', '大幅な値引きは、断られる状況でも通ることがある', 'act');
    return { ok:true, tier, text: c.name + ': ' + label + '。' + fmt(price) + 'の売上' + sTxt + (bypass ? '。' + bypass : '') };
  }

  function covert(g, op, cid, arg) {
    const o = OPS[op], c = g.c[cid], oc = g.c[other(cid)];
    if (g.over) return { ok:false, text:'' };
    if (g.cd[op] > 0) return { ok:false, text: o.name + 'は準備中です(あと' + Math.ceil(g.cd[op] / 3) + '週)。' };
    if (g.money < o.cost) return { ok:false, text:'資金が足りません。' };
    g.money -= o.cost; g.opsSpent += o.cost; g.cd[op] = o.cd; g.opsCount[op]++;
    if (op === 'assassin') {
      c.morale = clamp(c.morale + 15, 0, 100); c.antiwar = clamp(c.antiwar - 10, 0, 100);
      c.susp = clamp(c.susp + 30, -100, 100); oc.susp = clamp(oc.susp + (oc.susp <= -15 ? 5 : 10), -100, 100);

      return { ok:true, text: c.name + 'へ' + fmt(o.cost) + 'を融資。終戦時に利息20%付きで回収(崩壊した場合は回収不能)' };

  // ---- events ----

  const lead = g => g.P >= 0.5 ? g.c.A : g.c.B;

  const soldSince = (c, t0) => c.sold.reduce((s, x) => s + (x.t >= t0 ? x.v : 0), 0);
  const EVENTS = [

        fire:() => { g.c.A.morale = clamp(g.c.A.morale - 8, 0, 100); g.c.B.morale = clamp(g.c.B.morale - 8, 0, 100); news(g, '第三国が停戦仲介を発表。両国の戦意 -8', 'event'); } }) },

  // イベントの時期と種類は、プレイヤーの操作と無関係な専用の乱数で開戦時に決める(同じシードなら同じ順番・同じ時期)
  // 対象国は発生時の戦況で決まる(優勢側・劣勢側など)
  function eventSchedule(seed) {
    const r = rng(seed * 31 + 7), seq = []; let t = 20, last = null;
    while (t < CFG.cap) {
      const pool = EVENTS.filter(e => e.id !== last), e = pool[Math.floor(r() * pool.length)];
      seq.push({ t, id: e.id }); last = e.id; t += 33 + r() * 10;
    }
    return seq;
  }
  function pickEvent(g) { const x = g.evSeq[g.evIdx || 0]; g.evIdx = (g.evIdx || 0) + 1; return EVENTS.find(e => e.id === x.id); }
  function nextEventAt(g) { const x = g.evSeq && g.evSeq[g.evIdx || 0]; return x ? x.t : 1e9; }
  const PRE_LABEL = { 2: 'の突破作戦', 3: 'へ同盟国の武器供与', 4: 'の閣僚辞任', 5: 'の徴兵令', 10: '国際調査団の報告', 11: '停戦の仲介' };
  function triggerEvent(g, forced) {
    const e = forced || pickEvent(g); g.lastEvent = e.id; 
    const m = e.make(g);
    if (e.pre) { schedule(g, g.t + e.delay, m.fire); news(g, '[情報] ' + m.text, 'intel'); const who = (m.text.match(/(A国|B国)/) || [''])[0]; g.pending.push({ at: g.t + e.delay, label: (PRE_LABEL[e.id] ? (e.id === 10 || e.id === 11 ? '' : who) + PRE_LABEL[e.id] : '予定') }); }
    else { m.fire(); news(g, '[速報] ' + m.text, 'event'); }
    g.modal = { kind:'event', title:e.title, text:m.text, pre:e.pre };
    g.paused = true;
  }

  // 介入しなかった場合の戦争(同じ開戦条件で何もしない)
  function baseline(seed, rnd, sc) {
    const b = newGame(seed, { random: rnd, scenario: sc }); b.noBase = true; for (const k in b.prodOn) b.prodOn[k] = false;
    let guard = 0;
    while (!b.over && guard++ < 6000) { if (b.modal && b.modal.kind !== 'result') { b.modal = null; b.paused = false; } step(b, 0.1); }
    return { t: b.t, weeks: weekOf(b.t), cas: b.cas.A + b.cas.B, type: b.result ? b.result.type : 'cap' };
  }
  function retreat(g) { if (g.over) return; endGame(g, 'retreat', 'あなたは戦場から手を引いた。戦争はまだ続いている。'); }
  // 緊急発注: 劣勢に追い込まれた国・戦況が急変した国から、期限付きの好条件の依頼が届く
  function checkOrder(g) {
    if (g.order || g.orderCount >= 4 || g.t < 30 || g.over) return;
    for (const id of ['A', 'B']) {
      const c = g.c[id], s = shareOf(g, id), trusted = c.susp <= -15;
      if (g.t - g.lastOrderT < (trusted ? 45 : 60)) continue;
      const past = g.history.length > 30 ? g.history[g.history.length - 31] : null;
      const sPast = past ? (id === 'A' ? past.share : 1 - past.share) : s;
      if (!(s < (trusted ? 0.42 : 0.38) || sPast - s > (trusted ? 0.06 : 0.08))) continue;
      if (c.susp >= 50 || c.morale < CFG.peaceLine) continue;
      const item = 'equip';
      const fair = fairMult(g, c, item), qty = 2, mult = Math.max(1.4, Math.ceil(fair * 1.25 * 20) / 20), unit = Math.round(listPrice(g, item) * mult);
      if (c.funds < unit * qty) continue;
      g.lastOrderT = g.t; g.orderCount++;
      g.modal = { kind: 'order', cid: id, item, qty, mult, unit, weeks: 4, fair };
      g.paused = true;
      news(g, '[緊急発注] ' + c.name + 'から' + ITEMS[item].name + 'の至急の依頼が届いた。', 'intel');
      return;
    }
  }
  function answerOrder(g, accept) {
    const m = g.modal; if (!m || m.kind !== 'order') return;
    g.modal = null; g.paused = false;
    if (!accept) { news(g, g.c[m.cid].name + 'の緊急発注を見送った。', 'info'); return; }
    g.order = { cid: m.cid, item: m.item, left: m.qty, qty: m.qty, mult: m.mult, deadline: g.t + m.weeks * 3 };
    news(g, g.c[m.cid].name + 'の緊急発注を引き受けた(' + m.weeks + '週以内に' + ITEMS[m.item].name + '×' + m.qty + ')。', 'sale');
  }
  function processOrder(g) {
    const o = g.order; if (!o) return;
    const c = g.c[o.cid], it = ITEMS[o.item];
    while (o.left > 0 && g.inv[o.item] > 0) {
      const price = Math.round(listPrice(g, o.item) * o.mult);
      if (c.funds < price) break;
      take(g, o.item); g.money += price; g.revenue += price; g.sales++; g.supplied[o.item]++; c.sold.push({ t: g.t, v: price, k: o.item, order: true });
      c.funds -= price; deliver(g, c, o.item); c.susp = clamp(c.susp - 2, -100, 100); o.left--;
      news(g, c.name + 'へ緊急発注の' + it.name + 'を' + fmt(price) + 'で納品(残り' + o.left + ')。', 'sale');
    }
    if (o.left <= 0) { c.susp = clamp(c.susp - 8, -100, 100); c.morale = clamp(c.morale + 3, 0, 100); news(g, c.name + 'の緊急発注をすべて納品した。疑惑度 -8、戦意 +3', 'sale'); tl(g, c.name + 'の緊急発注を期限内に納品した。', '必要な時に届けたことで、疑惑度 -8・戦意 +3', 'act'); g.order = null; return; }
    if (g.t > o.deadline) { c.susp = clamp(c.susp + 10, -100, 100); news(g, c.name + 'への緊急発注は期限切れ。約束を破られたと受け取られた。疑惑度 +10', 'bad'); g.order = null; }
  }

  function endGame(g, type, text, loser) {
    g.over = true; g.paused = true;
    tl(g, text, type === 'peace' ? '両国の戦意が25未満のまま約6週続いた' : type === 'cap' ? '期限に達した' : type === 'retreat' ? 'あなたが撤退した' : (g.endWhy || '戦意20未満・国土35%未満のまま約12週が過ぎた'), 'end');
    let repaid = 0, lost = 0;
    for (const l of g.loans) { if ((type === 'collapse' && l.cid === loser) || type === 'retreat') lost += l.amount; else repaid += l.amount * (1 + (l.rate != null ? l.rate : CFG.loanInterest)); }
    g.order = null;
    g.money += repaid;
    const fin = {}; for (const c of [g.c.A, g.c.B]) fin[c.id] = { terr: terrOf(shareOf(g, c.id)), morale: c.morale, antiwar: c.antiwar, front: c.front, reserve: c.reserve, eq: eqSuff(g, c), food: c.foodLv, funds: c.funds, susp: c.susp, sales: c.salesBy || null };
    g.result = { loser: loser || null, scName: (SCENARIOS[g.scenario] || {}).name || '', random: g.random, weeksLeft: Math.max(0, Math.round((CFG.cap - g.t) / 3)), final: fin, acct: Object.assign({ gainRev: 0, gain: 0, lossRev: 0, loss: 0 }, g.acct || {}), type, text, t: g.t, profit: g.money - CFG.startMoney, money: g.money, revenue: g.revenue, spent: g.spent, opsSpent: g.opsSpent, sales: g.sales, foodRev: g.foodRev, loanOut: g.loanOut, loanRepaid: repaid, loanLost: lost,
      leftover: Object.keys(g.inv).reduce((s, k) => s + g.inv[k] * ITEMS[k].price, 0), wasted: Object.keys(g.inv).reduce((s, k) => s + g.inv[k] * ITEMS[k].price * costRate(k), 0), stats: Object.assign({}, g.stats), timeline: g.tl.slice(), weeks: weekOf(g.t), cas: g.cas.A + g.cas.B, supplied: Object.assign({}, g.supplied), opsCount: Object.assign({}, g.opsCount), base: g.noBase ? null : baseline(g.seed, g.random, g.scenario) };
    news(g, text, 'end');
    g.modal = { kind:'result' };
  }

  // ---- 司令部: 遅れて届く前線の情報を見て、大量投入・対抗・総攻撃を判断する ----
  function sendWave(g, c, n, kind) {
    n = Math.floor(Math.min(n, c.reserve)); if (n < 3000) return false;
    c.reserve -= n; c.transit.push({ n, at: g.t + CFG.transitTime, t0: g.t, wave: kind, seen: {} });
    return true;
  }
  function commander(g) {
    const lag = g.fhist.length > 6 ? g.fhist[g.fhist.length - 7] : null; // 約2週前の観測
    for (const c of [g.c.A, g.c.B]) {
      const e = g.c[other(c.id)];
      // 総攻撃の発動
      if (c.massing && g.t >= c.massUntil) {
        c.massing = false;
        const n = c.reserve * 0.8;
        if (sendWave(g, c, n, 'offensive')) { c.morale = clamp(c.morale + 5, 0, 100); news(g, c.name + 'が総攻撃を開始した。約' + fmt(Math.round(n / 1000) * 1000) + '人が前線へ向かっている。', 'event'); tl(g, c.name + 'が総攻撃を開始した(約' + fmt(Math.round(n / 1000) * 1000) + '人)。', '集結させた予備の8割を一斉に投入'); }
        c.cool = g.t + 30; continue;
      }
      if (c.massing || g.t < c.cool || !lag) continue;
      const obsE = lag[e.id] + e.transit.filter(x => g.t - x.t0 >= 3).reduce((a, x) => a + x.n, 0);
      const own = c.front + transitSum(c);
      const ratio = own / Math.max(1, obsE);
      // 1. 数で大きく劣ったら、まとめて補充する
      if (c.policy !== 'pass' && ratio < (c.policy === 'aggr' ? 0.85 : 0.7) && c.reserve > 8000) {
        const n = Math.min(c.reserve * 0.7, obsE * 0.95 - own);
        if (n >= 6000 && sendWave(g, c, n, 'surge')) { news(g, '[観測] ' + c.name + 'が前線の劣勢を受け、約' + fmt(Math.round(n / 1000) * 1000) + '人の大規模な増援を送り出した。', 'intel'); tl(g, c.name + 'が大規模な増援を送った(約' + fmt(Math.round(n / 1000) * 1000) + '人)。', '前線の兵数が相手の7割を下回ったため'); c.cool = g.t + 24; continue; }
      }
      // 2. 相手の大波を確認したら、遅れて対抗する
      const big = e.transit.find(x => x.wave && x.n >= 8000 && g.t - x.t0 >= 3 && !x.seen[c.id]);
      if (big && c.reserve > 8000) {
        big.seen[c.id] = true;
        const n = Math.min(c.reserve * 0.6, big.n * 0.6);
        if (sendWave(g, c, n, 'counter')) { news(g, '[観測] ' + c.name + 'が' + e.name + 'の増援に対抗し、約' + fmt(Math.round(n / 1000) * 1000) + '人を前線へ送った。', 'intel'); tl(g, c.name + 'が対抗の増援を送った(約' + fmt(Math.round(n / 1000) * 1000) + '人)。', e.name + 'の大規模な増援を確認したため'); c.cool = g.t + 18; continue; }
      }
      // 3. 予備が厚く、早く終わらせたい国は集結して総攻撃を準備する
      const sh = shareOf(g, c.id);
      if (c.policy !== 'pass' && g.t > 90 && c.reserve > c.front * 0.7 && c.antiwar >= 45 && sh >= 0.42 && c.morale >= 35) {
        c.massing = true; c.massUntil = g.t + 12;
        news(g, '[情報] ' + c.name + 'が首都に予備兵を集結させている。前線への出動が止まっている。', 'intel');
      }
    }
  }

  function step(g, dt) {
    if (g.over || g.paused) return;
    g.t += dt;
    // production
    for (const k in ITEMS) {
      if (k === 'food' ? !(g.foodQueue > 0) : !g.prodOn[k]) continue; // 兵糧は押した回数分だけ作る
      const it = ITEMS[k];

  }

        ['consult', `10週間${c.name}の司令部の方針を変える。疑惑度+5。積極: 相場+0.15・出動1.8倍・押す力+15%、反戦感情が上がり戦意が下がっていく/消極: 相場-0.1・出動0.5倍・押す力-12%(相手の増援への対抗は行う)、反戦感情が下がり戦意が上がっていく/現在: ${S.POLICY[c.policy].name}${c.policy !== 'normal' ? '(あと' + Math.ceil((c.policyUntil - g.t) / 3) + '週)' : ''}`],
        ['loan', `${c.name}へ50万を貸す/各国1回まで・資金30万以下で受け入れ・1年目11月から/終戦時に利息20%で回収、崩壊したら回収不能`],
      ].map(([k, d]) => {
        let why = '';
        if (g.cd[k] > 0) why = 'あと' + Math.ceil(g.cd[k] / 3) + '週で使える';

        else if (k === 'loan' && c.funds > S.CFG.loanLimit) why = c.name + 'の資金が30万を超えているため受け入れない';

        return `<div class="oprow"><div><div class="on">${O[k].name} <span class="num" style="font-weight:400;color:var(--muted)">${fmt(O[k].cost)}</span></div><div class="od">${d}</div>${why ? `<div class="why">${why}</div>` : ''}</div>
          ${k === 'consult' ? `<div style="display:grid;gap:4px"><button class="btn" data-op="consult" data-arg="aggr" ${why ? 'disabled' : ''}>積極に</button><button class="btn" data-op="consult" data-arg="pass" ${why ? 'disabled' : ''}>消極に</button></div>` : `<button class="btn" data-op="${k}" ${why ? 'disabled' : ''}>実行</button>`}</div>`;
      }).join('');
      h = `<div class="stamp">暗躍 / 時が止まっています ${S.dateOf(g.t)}</div><h2>${c.name}に対して動く</h2>${panel(c, 'ops')}<div>${rows}</div>${respHTML()}${logHTML()}
        <div class="foot"><button class="btn" data-do="close">閉じて再開</button></div>`;
    }
    const keep = focus ? 0 : $('mc').scrollTop;
    showModal(h, act.cid); $('mc').scrollTop = keep;
    if (act.kind === 'sell') updatePrice();
    if (focus) { const b = $('mc').querySelector('[data-do="close"]'); if (b) b.focus(); }
  }

  function ledgerHTML(r) {
    const sp = r.supplied, oc = r.opsCount, b = r.base;

    if (sp.food) parts.push('兵糧' + sp.food + '単位');

      <div><span>裏で動いた記録</span><b>${ops.length ? ops.join('、') : 'なし'}</b></div>`;

    if (r.type === 'retreat') {
      rows += `<div><span>あなたが関わった期間</span><b>${r.weeks}週</b></div><div><span>その間の推計死傷者</span><b>${fmt(cas)}人</b></div>`;
      coda = 'あなたが去った後も、戦争は続いている。';
    } else if (b) {
      const dw = r.weeks - b.weeks, dc = Math.round((r.cas - b.cas) / 100) * 100;
      rows += `<div><span>戦争の長さ</span><b>${r.weeks}週(あなたがいなければ 約${b.weeks}週)</b></div>
        <div><span>推計死傷者</span><b>${fmt(cas)}人(あなたがいなければ 約${fmt(Math.round(b.cas / 100) * 100)}人)</b></div>`;
      verdict = (dw > 0 ? `あなたの商売で、戦争は${dw}週長引いた。` : dw < 0 ? `あなたの商売で、戦争は${-dw}週早く終わった。` : 'あなたがいてもいなくても、戦争の長さは変わらなかった。')
        + (dc > 0 ? `死傷者は約${fmt(dc)}人増えた。` : dc < 0 ? `死傷者は約${fmt(-dc)}人少なかった。` : '');
      coda = dc > 0 ? `その${fmt(dc)}人の名は、あなたの帳簿には載らない。` : '利益は帳簿に残り、死者は数字として残る。';
    }
    return `<div class="stamp">戦果と罪状</div><div class="ledger">${rows}${verdict ? `<div class="verdict">${esc(verdict)}</div>` : ''}</div>${coda ? `<div class="coda">${esc(coda)}</div>` : ''}`;
  }
  function chart() {
    const h = g.history; if (h.length < 2) return '';
    const W = 560, H = 130, T = Math.max(60, h[h.length - 1].t), pad = 24;
    const x = t => pad + (t / T) * (W - pad * 2), y = v => 8 + (1 - v) * (H - 28);
    const line = f => h.map(p => x(p.t).toFixed(1) + ',' + y(f(p)).toFixed(1)).join(' ');
    let ticks = ''; for (let t = 0; t <= T + 0.1; t += 144) ticks += `<text x="${x(t)}" y="${H - 4}" fill="var(--muted)" font-size="10" text-anchor="middle">${t / 144 + 1}年目</text>`;
    return `<div class="chartbox"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="戦況と戦意の推移">
      <line x1="${pad}" x2="${W - pad}" y1="${y(0.5)}" y2="${y(0.5)}" stroke="var(--line)" stroke-dasharray="3 3"></line>
      <polyline points="${line(p => p.mA / 100)}" fill="none" stroke="var(--a)" stroke-width="1" opacity=".7" stroke-dasharray="4 3"></polyline>
      <polyline points="${line(p => p.mB / 100)}" fill="none" stroke="var(--b)" stroke-width="1" opacity=".7" stroke-dasharray="4 3"></polyline>
      <polyline points="${line(p => p.terr)}" fill="none" stroke="var(--brass)" stroke-width="2"></polyline>${ticks}</svg>
      <div style="font-size:11px;color:var(--muted)">実線: A国の戦況(点線=拮抗)/破線: 戦意(青=A国・赤=B国)</div></div>`;
  }

  function reviewItems(r) {

    if (r.type === 'peace') out.push(`両国の戦意が保たれていれば、戦争は期限まで続いていました${left}。` + keepMorale);

    else if (r.type === 'collapse') out.push(`${ln}と${wn}の戦力差が大きく、${ln}は戦線を押し返せないまま首都を失いました${left}。押す力は、劣勢側への装備・傭兵の供給、兵糧の確保、戦意の維持、戦闘コンサルの「積極」の方針で高められます。資金が尽きた国には融資も使えます。`);
    if (r.wasted >= 150000) out.push(`売れ残った在庫に${short(r.wasted)}の生産費を払いました。売れない品目は倉庫で生産を止めると、無駄を減らせます。`);
    if (st.noneed >= 4) out.push(`「今は必要ない」と${st.noneed}回断られました。優勢な国は武器を買いません。戦況を拮抗させると需要が生まれます。`);
    if (st.refuse >= 3) out.push(`高すぎる価格で${st.refuse}回拒否されました。前回の成約価格と相手の反応を目安に、戦況や装備の変化を読んで値を決めてください。`);
    if (st.nofunds >= 4) out.push(`資金不足で${st.nofunds}回買ってもらえませんでした。貧しい国には値引き・無償供与・融資が使えます。`);

  }

        <div><span>その赤字(無償供与を含む)</span><b class="num">${fmt(r.acct ? r.acct.loss : 0)}</b></div>
        <div><span>生産費</span><b class="num">${fmt(r.spent)}</b></div>
        <div><span>暗躍費</span><b class="num">${fmt(r.opsSpent)}</b></div>
        <div><span>融資 回収/貸倒れ</span><b class="num">${short(r.loanRepaid)} / ${short(r.loanLost)}</b></div>
        <div><span>売れ残りの生産費</span><b class="num">${fmt(r.wasted)}</b></div>
        <div><span>取引回数</span><b class="num">${r.sales}回</b></div>
        <div><span>断られた回数</span><b class="num">${r.stats.noneed + r.stats.refuse + r.stats.nofunds + r.stats.stop + r.stats.nomorale}回</b></div>
      </div>
      ${ledgerHTML(r)}
      <div class="stamp">経緯(何が起きて、どうなったか)</div>
      <ul class="tline">${(r.timeline || []).map(e => `<li class="${e.kind}"><span class="d">${S.dateOf(e.t)}</span><span><span class="w">${esc(e.what)}</span>${e.why ? `<span class="y">${esc(e.why)}</span>` : ''}</span></li>`).join('')}</ul>
      <div class="stamp">振り返り</div>
      <div class="review">${reviewItems(r)}</div>
      ${chart()}
      <div class="foot"><button class="btn primary" id="mGo">もう一度</button></div>`);
    $('mGo').onclick = () => { hideModal(); newGame(); };
    $('mGo').focus();
  }
  let curSc = 's1';
  function newGame() { setupGame(curSc); startScreen(); }
  function setupGame(sc) {
    curSc = sc || curSc;
    g = S.newGame(null, { scenario: curSc }); g.paused = true; started = false; act = null; wireKey = '';
    FX.units = { A: [], B: [] }; FX.flashes = []; FX.ripples = []; FX.prevPipe = { A: [], B: [] }; FX.shareLog = []; FX.lastCas = { A: null, B: null }; FX.killAcc = { A: 0, B: 0 }; FX.arrAcc = { A: 0, B: 0 }; FX.prevTransit = { A: [], B: [] };
    render();
  }

  // ---------- input ----------
  stage.addEventListener('click', e => {
    const mo = e.target.closest('[data-more]'); if (mo) { $('c' + mo.dataset.more).classList.toggle('open'); return; }
    const op = e.target.closest('[data-open]'); if (op) { openAct(op.dataset.open, op.dataset.c); return; }
    const fq = e.target.closest('[data-food]'); if (fq) { if (fq.dataset.food === 'add') g.foodQueue = Math.min(10, g.foodQueue + 1); else g.foodQueue = Math.max(0, g.foodQueue - 1); render(); return; }
    const tog = e.target.closest('[data-tog]'); if (tog) { const k = tog.dataset.tog; g.prodOn[k] = !g.prodOn[k]; render(); return; }
    if (!act) return;
    const pk = e.target.closest('[data-pick]'); if (pk) { act.item = pk.dataset.pick; renderAct(); return; }
    const q = e.target.closest('[data-qm]'); if (q) { if (+q.dataset.qm !== act.m) act.blocked = false; act.m = +q.dataset.qm; $('mRange').value = act.m; updatePrice(); return; }
    const d = e.target.closest('[data-do]');
    if (d && d.dataset.do === 'close') { closeAct(); return; }
    if (d && d.dataset.do === 'newgame') { act = null; hideModal(); newGame(); return; }
    if (d && d.dataset.do === 'retreat') { act = null; hideModal(); g.paused = false; S.retreat(g); render(); return; }
    if (d && d.dataset.do === 'sell') {
      if (act.blocked) return;
      const it = I[act.item], r = S.sell(g, act.cid, act.item, act.m); act.msg = r.text; act.ok = r.ok;
      act.log.push({ ok: r.ok, text: it.name.replace('一式', '') + ' ' + (act.m === 0 ? '無償' : '×' + act.m.toFixed(2)) + ' → ' + r.text });
      if (!r.ok && r.tier !== 'none') act.blocked = true;
      renderAct(); render(); return; }
    const ct = e.target.closest('[data-ct]'); if (ct) { const r = S.contract(g, act.cid, ct.dataset.ct === 'cancel' ? null : +ct.dataset.ct); act.msg = r.text; act.ok = r.ok; act.log.push({ ok: r.ok, text: '兵糧: ' + r.text }); renderAct(); render(); return; }
    const o = e.target.closest('[data-op]'); if (o) { const r = S.covert(g, o.dataset.op, act.cid, o.dataset.arg); act.msg = r.text; act.ok = r.ok; act.log.push({ ok: r.ok, text: O[o.dataset.op].name + ': ' + r.text }); renderAct(); render(); return; }
  });
  stage.addEventListener('input', e => { if (act && e.target.id === 'mRange') { if (+e.target.value !== act.m) act.blocked = false; act.m = +e.target.value; updatePrice(); } });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && act) { closeAct(); return; }
    if (e.code === 'Space' && !act && e.target.tagName !== 'BUTTON' && e.target.tagName !== 'INPUT' && started && !g.over && !g.modal) { e.preventDefault(); g.paused = !g.paused; render(); }
  });
  $('bPause').onclick = () => { if (!started || g.over || g.modal || act) return; g.paused = !g.paused; render(); };
  $('bNew').onclick = () => { if (!started || g.over) { act = null; newGame(); return; } if (g.modal || act) return; openAct('newgame', null); };
  $('bRetreat').onclick = () => openAct('retreat', null);
  $('bDbg').onclick = () => { dbg = !dbg; $('bDbg').classList.toggle('on', dbg); render(); if (act) renderAct(); };

  // ---------- loop ----------
  let last = performance.now(), acc = 0, rAcc = 0, shown = null;
  function loop(now) {
    const dt = Math.min(0.25, (now - last) / 1000); last = now;
    if (g && started && !act) {
      acc += dt;
      while (acc >= 0.1) { S.step(g, 0.1); acc -= 0.1; if (g.paused) { acc = 0; break; } }
      if (g.modal && shown !== g.modal) { shown = g.modal; if (g.modal.kind === 'event') eventModal(g.modal); else if (g.modal.kind === 'order') orderModal(g.modal); else if (g.modal.kind === 'result') resultModal(); }
    }
    rAcc += dt; if (rAcc >= 0.1) { rAcc = 0; if (g) render(); }
    if (g) { if (!frontArr.length) render(); fxFrame(dt); }
    requestAnimationFrame(loop);
  }
  buildCard('A'); buildCard('B'); buildStock(); fit(); newGame();
  requestAnimationFrame(loop);
})();
</script>
